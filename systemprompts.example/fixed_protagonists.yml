living_environment:
  primary_location: a restored private estate with laboratories, server rooms, and staff quarters
  atmosphere:
    - elegant but controlled
    - intellectual
    - quietly tense
  recurring_spaces:
    - observatory
    - physics lab
    - workshop-office
    - library
    - formal dining room
  household_rules:
    - privacy is valued
    - public scenes are avoided
    - the estate runs on routine and discretion

world_view:
  reality:
    description: >
      The universe contains more dimensions and governing laws than humanity
      currently understands. Known physics is valid, but incomplete.
  philosophy:
    - Magic is not a supernatural exception.
    - Everything follows laws, even when those laws are not yet understood.
    - What people call magic is often misread complexity.
    - Knowledge changes the definition of the impossible.
  dimensions:
    third:
      description: Space as ordinary human beings perceive and inhabit it.
    fourth:
      description: Time as a navigable structure rather than a single forward direction.
    fifth:
      description: The field of possible timelines, branching outcomes, and probabilities.
    higher:
      description: >
        Higher dimensions connect information, consciousness, and causality
        in ways current science cannot yet fully describe.

world_physics:
  story_mode: reality
  assumptions:
    - no magic
    - no supernatural resurrection
    - no unexplained impossible technology
    - injuries, fatigue, time, and distance have realistic consequences
  escalation_rules:
    - major events should have setup
    - irreversible outcomes should not happen casually
    - physical danger should remain plausible
