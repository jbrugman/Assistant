lmstudio.url=http://localhost:1234/v1/chat/completions

appmode=default

model.chat=google/gemma-4-12b-qat
model.validator=google/gemma-4-12b-qat

file.systemPrompt=systemprompt.md
file.rules=rules.md
file.summary=summary.md
file.history=history.json
file.legacyHistory=history.md

chat.maxRecentTurns=6
chat.temperature=1.0
chat.topK=45
chat.topP=0.9
chat.minP=0.05
chat.repeatPenalty=1.05

summary.batchMessages=10
summary.temperature=0.2
summary.topP=0.9

validation.temperature=0.0
validation.topP=0.1

timeout.chatSeconds=350
timeout.summarySeconds=350
timeout.validationSeconds=180

response.hideReasoningBlocks=true
response.validationFailClosedMessage=Ja zeg, probeer maar even iets anders.
